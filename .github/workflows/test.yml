name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        pyelastica: ['0.2.2', '0.3.3.post2', '1.0.0']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.python == '3.15' }}
          cache: pip
      - name: Install current numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest "numpy>=2,<3" "pyelastica==${{ matrix.pyelastica }}"
          python -m pip check
      - name: Test real rod construction, actuation, callbacks, and short integration
        run: python -m pytest -q

  minimum-dependencies:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - name: Install minimum numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest "numpy==1.26.4" "numba==0.61.0" "matplotlib==3.8.0" "pyelastica==0.2.2"
          python -m pip check
      - name: Test lower dependency bounds
        run: python -m pytest -q
